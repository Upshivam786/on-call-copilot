[project]
name = "oncall-copilot"
version = "0.1.0"
description = "RAG-powered incident response assistant for on-call engineers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "On-Call Copilot Team"}
]
dependencies = [
    # Core
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "sqlmodel>=0.0.14",

    # Redis
    "redis>=5.0.0",

    # RAG / LLM
    "llama-index>=0.10.0",
    "llama-index-embeddings-openai>=0.1.0",
    "llama-index-llms-openai>=0.1.0",
    "llama-index-vector-stores-postgres>=0.1.0",
    "openai>=1.30.0",
    "tiktoken>=0.7.0",

    # Observability
    "langfuse>=2.0.0",

    # Utilities
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0.1",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "ipython>=8.20.0",
]
eval = [
    "ragas>=0.1.0",
    "datasets>=2.19.0",
]
ui = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
]

[tool.setuptools]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TID", "PTH", "ERA", "PL", "TRY"]
ignore = ["S101", "S311", "PTH123"]
fixable = ["F", "I", "N", "W", "UP", "B", "C4", "SIM", "TID", "PTH", "ERA", "PL", "TRY"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"